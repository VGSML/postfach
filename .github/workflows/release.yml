name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # macos-14+ runners are Apple Silicon; the native deps are darwin-arm64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (default build)
        run: go vet ./... && go test ./...
        env:
          GOWORK: "off"

      - name: Build with Prompt Guard 2 support
        run: |
          make deps-guard
          make build-guard
        env:
          GOWORK: "off"

      - name: Assemble package
        run: |
          mkdir -p dist/postfach/third_party/onnxruntime/lib
          cp postfach-mcp install.sh uninstall.sh README.md dist/postfach/
          cp -R skills commands .claude-plugin .codex-plugin dist/postfach/
          cp third_party/onnxruntime/lib/libonnxruntime*.dylib dist/postfach/third_party/onnxruntime/lib/
          tar -czf "postfach-darwin-arm64.tar.gz" -C dist postfach

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "postfach $GITHUB_REF_NAME" \
            --generate-notes \
            "postfach-darwin-arm64.tar.gz"
